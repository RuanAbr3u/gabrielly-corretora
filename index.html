<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=tela-inicial/index.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gabrielly Silva - Corretora de Imóveis CRECI 26.012." />
    <link rel="icon" type="image/jpeg" href="tela-inicial/img/logo.jpg" />
    <title>Gabrielly Silva | Corretora de Imóveis</title>
    <style>
      :root {
        --color-primary: #0f2d23;
        --color-primary-dark: #081f18;
        --color-gold: #d9b05f;
        --color-text-light: #f7f7f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: var(--color-text-light);
        background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
        font-family: Arial, sans-serif;
      }

      .loading {
        text-align: center;
      }

      .logo {
        width: 120px;
        height: 90px;
        margin: 0 auto 1rem;
        object-fit: contain;
        border-radius: 8px;
      }

      .spinner {
        width: 40px;
        height: 40px;
        margin: 1rem auto;
        border: 4px solid rgba(217, 176, 95, 0.24);
        border-top-color: var(--color-gold);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="loading">
      <img class="logo" src="tela-inicial/img/logo.jpg" alt="Logo Gabrielly Silva Corretora de Imóveis" width="120" height="90" />
      <h1>Gabrielly Silva</h1>
      <p>Corretora de Imóveis</p>
      <div class="spinner" aria-hidden="true"></div>
      <p>Redirecionando...</p>
    </main>
    <script>
      setTimeout(() => {
        window.location.href = "tela-inicial/index.html";
      }, 100);
    </script>
  </body>
</html>
